# XcodeGen spec. The cloud Mac turns this into PhoneLidar.xcodeproj at build time,
# so no Xcode project file is kept in the repository.
name: PhoneLidar

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic

targets:
  PhoneLidar:
    type: application
    platform: iOS
    sources:
      - path: PhoneLidar
    settings:
      base:
        # Change this if you publish through TestFlight and the ID is already taken.
        PRODUCT_BUNDLE_IDENTIFIER: ca.gervais.phonelidar
        PRODUCT_NAME: PhoneLidar
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

  # Host-less XCTest bundle (no TEST_HOST / BUNDLE_LOADER): it compiles the pure-logic source files listed
  # below together with the tests, so it runs on any iOS Simulator without LiDAR, RoomPlan or Object Capture.
  # When a new pure-logic file needs tests, add it to this list.
  PhoneLidarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PhoneLidarTests
      - path: PhoneLidar/Line/Baseline.swift
      - path: PhoneLidar/Line/DepthColors.swift
      - path: PhoneLidar/Line/LineRecording.swift
      - path: PhoneLidar/Line/SpeedEstimator.swift
      - path: PhoneLidar/Line/TopoGridFile.swift
      - path: PhoneLidar/Line/TopoMapBuilder.swift
      - path: PhoneLidar/Line/TopoReplayData.swift
      - path: PhoneLidar/Storage/Formatting.swift
      - path: PhoneLidar/Storage/ScanStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.gervais.phonelidar.tests
        PRODUCT_NAME: PhoneLidarTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PhoneLidar:
    build:
      targets:
        PhoneLidar: all
    run:
      config: Debug
    archive:
      config: Release
  PhoneLidarTests:
    build:
      targets:
        PhoneLidarTests: all
    test:
      config: Debug
      targets:
        - PhoneLidarTests
